proxy_cache_path /var/cache/nginx/overpass levels=1:2 keys_zone=overpass_cache:10m max_size=200m inactive=7d use_temp_path=off;
limit_req_zone $binary_remote_addr zone=overpass_limit:10m rate=20r/m;

server {
    listen 80;
    server_name storygrove.id www.storygrove.id;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:svg|png|jpg|jpeg|webp|ico)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # AR model files (danau/ar): explicit MIME types since these
    # extensions aren't in nginx's default mime.types. iOS Quick Look
    # in particular requires the correct model/vnd.usdz+zip Content-Type
    # to launch AR from a plain link tap.
    location ~* \.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=86400";
    }
    location ~* \.usdz$ {
        default_type model/vnd.usdz+zip;
        add_header Cache-Control "public, max-age=86400";
    }

    # Code files: always revalidate so deploys take effect immediately
    # instead of being served stale from cache for up to an hour.
    location ~* \.(?:css|js|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Shared cache in front of the public Overpass API for the danau map's
    # lake lookups. Callers send grid-snapped bounding boxes, so nearby
    # searches produce identical query strings and land on the same cache
    # entry — one Overpass hit serves every visitor in that area, not just
    # repeat visits from the same browser.
    #
    # Hardening: this only exists to serve the danau feature's own
    # bbox+natural=water lookups, not as a general-purpose Overpass relay —
    # GET only, rate-limited per IP, and the query must reference "water" or
    # it's rejected outright.
    location /api/overpass {
        limit_except GET { deny all; }
        limit_req zone=overpass_limit burst=10 nodelay;

        if ($arg_data !~* "water") {
            return 400;
        }

        resolver 127.0.0.11 valid=300s;
        proxy_pass https://overpass-api.de/api/interpreter$is_args$args;
        proxy_ssl_server_name on;
        proxy_set_header Host overpass-api.de;
        proxy_cache overpass_cache;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 502 503 504 30s;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_connect_timeout 10s;
        proxy_read_timeout 28s;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header Access-Control-Allow-Origin "https://storygrove.id" always;
    }
}
