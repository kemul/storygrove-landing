<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Danau Kenanga — StoryGrove</title>
<meta name="description" content="Jelajahi Danau Kenanga (Danau UI) secara interaktif — sebuah eksperimen StoryGrove yang mendalami 4 Pilar Kurikulum Sekolah Alam: Akhlak, Logika Ilmiah, Leadership, dan Bisnis.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="styles.css?v=3">
</head>
<body>

<div id="map"></div>

<a href="https://storygrove.id" class="badge" aria-label="Kembali ke StoryGrove">
  <svg viewBox="0 0 40 40" width="18" height="18"><path d="M20 6c5 5 8 10 8 15a8 8 0 1 1-16 0c0-5 3-10 8-15Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 17v17" stroke="currentColor" stroke-width="1.8"/></svg>
  <span>StoryGrove</span>
</a>

<div class="legend" id="legend" hidden>
  <p class="legend-title" id="legendTitle">Danau Kenanga</p>
  <p class="legend-sub" id="legendSub">4 Pilar Sekolah Alam — ketuk titik untuk menjelajah</p>
  <p class="progress" id="progress">0/4 titik dikunjungi</p>
  <button class="legend-change" id="btnChangeLake">Ganti danau</button>
</div>

<div class="toast" id="toast"></div>

<div class="menu-screen" id="menuScreen">
  <div class="menu-card">
    <p class="menu-eyebrow">StoryGrove — Digital Companion</p>
    <h1 class="menu-title">Jelajah Danau</h1>
    <p class="menu-desc">4 Pilar Kurikulum Sekolah Alam — Akhlak, Logika Ilmiah, Leadership, dan Bisnis — didalami langsung lewat pengamatan nyata di tepi danau.</p>

    <button class="menu-option" id="btnNearest">
      <span class="menu-option-icon">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 21s-6.5-5.6-6.5-11A6.5 6.5 0 0 1 18.5 10c0 5.4-6.5 11-6.5 11Z" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
      </span>
      <span class="menu-option-text">
        <strong>Danau Terdekat</strong>
        <small>Cari &amp; langsung mulai tracking di danau terdekat dari lokasimu</small>
      </span>
    </button>

    <button class="menu-option" id="btnChoose">
      <span class="menu-option-icon">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 6h16M4 12h16M4 18h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </span>
      <span class="menu-option-text">
        <strong>Pilih Danau</strong>
        <small>Lihat daftar danau di sekitarmu, lalu mulai tracking</small>
      </span>
    </button>

    <div class="menu-list" id="menuList" hidden></div>
    <p class="menu-status" id="menuStatus"></p>
  </div>
</div>

<div class="popup-overlay" id="overlay"></div>
<div class="popup-card" id="popupCard">
  <button class="popup-close" id="popupClose" aria-label="Tutup">×</button>
  <p class="popup-kicker">
    <span class="popup-icon" id="popupIcon"></span>
    <span id="popupKicker"></span>
  </p>
  <h2 id="popupTitle"></h2>
  <div id="popupBody"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="script.js?v=3"></script>
</body>
</html>
