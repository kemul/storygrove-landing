i, Presipitasi, dan Infiltrasi. Bagaimana tetesan air yang sama terus berputar di bumi sejak jutaan tahun lalu?",funFact:"Air yang kamu minum hari ini mungkin saja pernah diminum oleh dinosaurus jutaan tahun lalu karena Siklus Air!",experimentId:"exp-04",quranicVerse:{surah:"QS. An-Nur",ayat:"43",arabicText:"أَلَمْ تَرَ أَنَّ اللَّهَ يُزْجِي سَحَابًا ثُمَّ يُؤَلِّفُ بَيْنَهُ ثُمَّ يَجْعَلُهُ رُكَامًا فَتَرَى الْوَدْقَ يَخْرُجُ مِنْ خِلَالِهِ",indonesianTranslation:"Tidaklah kamu melihat bahwa Allah mengarak awan, kemudian mengumpulkan antara (bagian-bagian)nya, kemudian menjadikannya bertindih-tindih, maka kelihatanlah olehmu hujan keluar dari celah-celahnya...",scienceReflection:"Ayat ini secara ilmiah mendeskripsikan tahap pembentukan awan kumulonimbus dan presipitasi hujan yang sangat presisi."}}],gm=[{id:"exp-01",title:"Eksperimen 01: Kejernihan Air Danau",category:"Analisis Kualitas Air",difficulty:"Mudah",duration:"15 Menit",materials:["3 Buah Jar / Gelas Bening (Air Danau, Air Sumur, Air Keruh)","Piringan Secchi Disk Mini (dari Experiment Kit)","Kaca Pembesar (Magnifying Glass)","Kertas Saring / Senter"],steps:["Isi Jar A dengan sampel air danau, Jar B air keruh, dan Jar C air bersih.","Arahkan senter dari samping jar. Amatilah jalurnya (Efek Tyndall).","Masukkan piringan Secchi Mini ke dalam jar hingga polanya tidak terlihat.","Ukur kedalaman (cm) di mana piringan mulai hilang dari pandangan.","Catat hasil pengamatanmu di Jurnal Sainsku!"],scientificExplanation:"Kejernihan air dipengaruhi oleh padatan tersuspensi (TSS). Efek Tyndall membuat berkas cahaya terlihat memendar di dalam air keruh akibat partikel melayang.",quranicConnection:"Air bersih murni adalah nikmat Allah yang wajib kita syukuri dan jaga kebersihannya.",interactiveSimType:"clarity",badgeReward:"Detektif Air",xpReward:100},{id:"exp-02",title:"Eksperimen 02: Kolom Retensi & Simulator Banjir",category:"Teknik Lingkungan",difficulty:"Sedang",duration:"20 Menit",materials:["Wadah Plastik Miniatur
